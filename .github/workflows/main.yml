name: GitHub AWS OIDC
on: 
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout
      uses: actions/checkout@v5

    - name: Configure AWS Credentials for OIDC
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-region: us-east-2
        role-to-assume: ${{ secrets.AWS_IAM_ROLE }}

    - name: Test AWS Credentials
      run: aws sts get-caller-identity

    - name: Zip the Lambda function
      run: zip my_deployment_package.zip lambda_function.py
    
    - name: Deploy Lambda Function
      uses: aws-actions/aws-lambda-deploy@v1.1.0
      with:
        function-name: getResults2026
        code-artifacts-dir: requirements.txt
        handler: lambda_function.lambda_handler
        runtime: python3.12
        # Add any additional inputs this action supports
